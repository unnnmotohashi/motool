<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF2 Maker</title>
<style>
  :root { --bg:#e6e8eb; --panel:#ffffff; --ink:#1d2127; --sub:#6b7380; --line:#c9ced6; --accent:#2f6fde; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:"KHDot", "BTDot", system-ui, sans-serif; background:var(--bg); color:var(--ink); font-size:12px; line-height:1; -webkit-font-smoothing:none; font-smooth:never; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  .top { color:var(--sub); text-decoration:none; margin-right:6px; }
  .top:hover { color:var(--ink); }
  .grow { flex:1; }
  .sp { width:10px; }
  .cnt { color:var(--sub); }
  .wbar { border-top:1px solid var(--line); }
  .hint { padding:8px 10px; color:var(--sub); line-height:1.6; }
  #srcName { color:var(--sub); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.4; }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:4px; background:#f5f6f8; font:inherit; color:var(--ink); cursor:pointer; }
  button:disabled { color:var(--sub); cursor:default; }
  button[aria-pressed=true] { background:var(--ink); border-color:var(--ink); color:#fff; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:disabled { opacity:.5; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:4px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px; border-bottom:1px solid var(--line); }
  label { display:flex; align-items:center; gap:6px; color:var(--sub); }
  .lv { display:flex; gap:2px; padding:2px; cursor:pointer; touch-action:none; }
  .lv i { width:12px; height:18px; border:1.5px solid var(--ink); background:#fff; }
  .lv i.on { background:var(--ink); }
  #db { width:36px; }
  #lr { width:24px; }
  .dd { position:relative; }
  .dd > button { width:60px; text-align:left; padding:6px 8px; color:var(--ink); }
  .dd > button::after { content:"▼"; float:right; }
  .dd.w > button, .dd.w .list { width:96px; }
  .dd.m > button, .dd.m .list { width:76px; }
  .list { position:absolute; top:100%; left:0; z-index:10; width:60px; max-height:240px; overflow:auto; background:#fff; border:1px solid var(--ink); }
  .list button { display:block; width:100%; text-align:left; border:0; border-radius:0; background:#fff; padding:5px 8px; }
  .list button:hover, .list button:focus-visible { background:var(--ink); color:#fff; outline:0; }
  .list button[aria-selected=true] { text-decoration:underline; }
  main { display:flex; gap:12px; align-items:flex-start; padding:12px; max-width:960px; }
  #list { flex:none; width:280px; max-height:60vh; overflow-y:auto; margin:0; padding:0; list-style:none; }
  #list li { display:flex; gap:12px; padding:8px 10px; border-top:1px solid var(--line); border-left:2px solid transparent; cursor:pointer; user-select:none; }
  #list li:first-child { border-top-color:transparent; }
  #list li:hover { background:#f5f6f8; }
  #list li.on { border-left-color:var(--accent); }
  #list li.lift { opacity:.4; }
  #list li.ins { box-shadow:inset 0 0 0 2px var(--ink); }
  #list li:focus-visible { outline-offset:-2px; }
  #list .k { width:56px; flex:none; color:var(--sub); }
  #list .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #list .empty { padding:32px 10px; justify-content:center; color:var(--sub); cursor:default; }
  #list .empty:hover { background:none; }
  #list .back { color:var(--sub); }
  body.drag #list { outline:2px dashed var(--accent); outline-offset:-2px; }
  #ed { flex:1; min-width:0; }
  #ed[hidden] { display:none; }
  #wave { display:block; width:100%; height:auto; touch-action:none; cursor:crosshair; }
  #wave:focus-visible { outline-offset:-2px; }
  #kb { margin:0 12px 12px; max-width:936px; overflow:hidden; }
  #piano { position:relative; height:100px; margin:10px; overflow-x:auto; overflow-y:hidden; user-select:none; touch-action:pan-x; }
  #piano div { position:absolute; top:0; border:1px solid var(--ink); }
  #piano .w { width:23px; height:86px; background:var(--bg); border-color:var(--line); border-radius:0 0 3px 3px; }
  #piano .b { width:14px; height:52px; background:var(--sub); border-color:var(--sub); z-index:1; border-radius:0 0 2px 2px; }
  #piano .has { cursor:pointer; }
  #piano .w.has { background:#fff; border-color:var(--ink); }
  #piano .b.has { background:var(--ink); border-color:var(--ink); }
  #piano .w.down { background:var(--line); }
  #piano .b.down { background:var(--sub); }
  #piano .sel { box-shadow:inset 0 -3px var(--accent); }
  #piano .root { box-shadow:inset 0 -7px var(--accent); }
  #piano span { position:absolute; left:0; right:0; bottom:10px; text-align:center; color:var(--sub); }
  @media (max-width:700px) { main { flex-direction:column; align-items:stretch; } #list { width:auto; } }
</style>
</head>
<body>
<header>
  <a class="top" href="../">Top</a>
  <button id="open" title="音声ファイル（wav・mp3など）かSF2を開く">開く</button>
  <button id="pickBtn" hidden title="SF2の中の別の楽器に切り替える。編集した内容は楽器ごとに残ります">楽器を選ぶ</button>
  <span id="srcName"></span>
  <span class="grow"></span>
  <button id="del" title="選んでいる音を消す（Deleteキーでも消せます）" disabled>この音を削除</button>
  <button id="clear">全部消す</button>
  <button class="primary" id="save" title="今の楽器をSF2として保存">保存</button>
  <input type="file" id="files" accept="audio/*,.sf2" multiple hidden>
</header>
<main>
  <ul id="list" class="box" aria-label="Samples"></ul>
  <section id="ed" class="box" hidden aria-label="音の編集">
    <div class="bar">
      <button id="play" aria-pressed="false" title="試しに鳴らす（ループする音は、もう一度押すまで鳴り続けます）">再生</button>
      <button id="norm" aria-pressed="false" title="音量を最大近くまで持ち上げてそろえる">ノーマライズ</button>
      <span class="sp"></span>
      <label>音量 <span class="lv" id="vol" role="slider" tabindex="0" aria-label="音量" aria-valuemin="1" aria-valuemax="10"></span> <span id="db"></span></label>
      <label>左右 <span class="lv" id="pan" role="slider" tabindex="0" aria-label="左右" aria-valuemin="-4" aria-valuemax="4"></span> <span id="lr"></span></label>
    </div>
    <div class="bar">
      <label title="この鍵盤で、録音したままの高さで鳴ります">元の高さ <span class="dd"><button id="root" aria-haspopup="listbox" aria-label="元の高さ"></button></span></label>
      <label title="この範囲の鍵盤で鳴ります。元の高さから離れるほど音程が変わります">鳴らす範囲 <span class="dd"><button id="lo" aria-haspopup="listbox" aria-label="鳴らす範囲の下"></button></span> 〜 <span class="dd"><button id="hi" aria-haspopup="listbox" aria-label="鳴らす範囲の上"></button></span></label>
      <span class="sp"></span>
      <button id="loop" aria-pressed="false" title="トランペットやサックスのように伸ばす音用。鍵盤を押している間、青い部分をくり返します">ループ</button>
      <span class="sp"></span>
      <label title="同じ番号の音どうしは同時に鳴らず、新しい音が鳴ると前の音が止まります（例：オープンとクローズのハイハット）。全部の音を同じ番号にすると、1音ずつしか鳴らない楽器になります">排他グループ <span class="dd"><button id="excl" aria-haspopup="listbox" aria-label="排他グループ"></button></span></label>
    </div>
    <div class="bar">
      <span class="cnt">音の粗さ</span>
      <button id="pSnes" aria-pressed="false" title="スーファミ風：16000Hz・12bit・こもり ふつう">スーファミ風</button>
      <button id="p64" aria-pressed="false" title="64風：22050Hz・12bit・こもり 強め">64風</button>
      <button id="pDs" aria-pressed="false" title="DS風：22050Hz・8bit・こもりなし">DS風</button>
      <button id="pOrig" aria-pressed="false" title="粗さをなくして元の音に戻す">元のまま</button>
      <span class="grow"></span>
      <button id="crushAll" title="今の音の「音の粗さ」を、この楽器の全部の音に同じように設定する">全部の音に同じ設定</button>
    </div>
    <div class="bar">
      <label title="1秒を何回に刻むか。下げると高い音が出なくなり、ザラッとした昔のゲーム機の音になります。目安：スーファミ風 11025〜16000Hz、DS風 16000〜22050Hz">サンプリング <span class="dd w"><button id="rate" aria-haspopup="listbox" aria-label="サンプリングレート"></button></span></label>
      <label title="音量を何段階で表すか。下げると、音が小さくなるところでジリジリしたノイズが出ます。目安：DS風 8bit、もっと荒く 4〜6bit">ビット数 <span class="dd w"><button id="bits" aria-haspopup="listbox" aria-label="ビット数"></button></span></label>
      <label title="スーファミのような、こもった柔らかい響きにします。高い音を削って、粗さの角を丸めます">こもり <span class="dd m"><button id="lpf" aria-haspopup="listbox" aria-label="こもり"></button></span></label>
    </div>
    <canvas id="wave" width="600" height="120" tabindex="0" role="application" aria-label="波形"></canvas>
    <div class="bar wbar">
      <button id="zoom" title="選んだ範囲まで拡大">拡大</button>
      <button id="all" title="全体を表示">全体</button>
      <span class="grow"></span>
      <span class="cnt" id="len"></span>
    </div>
    <div class="hint" id="hint"></div>
  </section>
</main>
<section id="kb" class="box" aria-label="鍵盤">
  <div class="bar">
    <button id="midi" aria-pressed="false" title="つないだMIDIキーボードで弾けるようにする（Chrome・Edge）">MIDIキーボード</button>
    <span class="cnt" id="dev"></span>
  </div>
  <div id="piano" aria-hidden="true"></div>
</section>

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const START_KEY = 36;                 // 新しい音はC2から空いている鍵盤へ
const MIN_LEN = 32;                   // 切り出し・ループの最短（サンプル点）
const W = 600, H = 120, INK = '#1d2127', LINE = '#c9ced6', ACC = '#2f6fde';
const VOL_DB = [-27, -24, -21, -18, -15, -12, -9, -6, -3, 0];   // 段階バーの10マス（3dB刻み）
const NOTE = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const keyName = k => NOTE[k % 12] + (Math.floor(k / 12) - 1);
const rangeName = s => s.lo === s.hi ? keyName(s.lo) : keyName(s.lo) + '-' + keyName(s.hi);
// 鍵盤を離してから消えるまでの秒数（読み込んだSF2の値があればそれを使う）
const relOf = s => s.rel ?? (s.loop ? 0.3 : 2);
let ctx, samples = [], cur = -1, drag = null, meta = {}, picking = null;
// source：開いているSF2。楽器（プリセット）ごとの編集内容を cache に残し、切り替えても戻れるようにする
let source = null;

const audio = () => { ctx = ctx || new AudioContext(); ctx.resume(); return ctx; };

// 1つの音 = サンプル＋鍵盤の範囲（lo〜hi）＋原音の高さで鳴る鍵盤（root）
function item(name, buf, k) {
  const n = buf.length;
  return { name, buf, a: 0, b: n, v0: 0, v1: n, norm: false, vol: 9, pan: 4,
           lo: k, hi: k, root: k, vlo: 0, vhi: 127, loop: false, ls: null, le: null, rate: 0, bits: 16, lpf: 0 };
}
const sortSamples = () => { const s = samples[cur]; samples.sort((p, q) => p.lo - q.lo || p.vlo - q.vlo); cur = samples.indexOf(s); };

// 読み込み：音声はモノラルにまとめて空いている鍵盤へ。SF2はプリセットを選んで丸ごと読み込む
async function add(files) {
  audio();
  const sf = files.find(f => /\.sf2$/i.test(f.name));
  if (sf) return openSF2(sf);
  let added = null;
  for (const f of files) {
    const k = samples.length ? Math.max(...samples.map(s => s.hi)) + 1 : START_KEY;
    if (k > 127) { alert('空いている鍵盤がありません'); break; }
    try {
      const src = await ctx.decodeAudioData(await f.arrayBuffer());
      const n = src.length, ch = src.numberOfChannels;
      const buf = ctx.createBuffer(1, n, src.sampleRate), m = buf.getChannelData(0);
      for (let c = 0; c < ch; c++) { const d = src.getChannelData(c); for (let i = 0; i < n; i++) m[i] += d[i] / ch; }
      samples.push(added = item(f.name.replace(/\.[^.]+$/, ''), buf, k));
    } catch { alert(`読み込めませんでした：${f.name}`); }
  }
  if (added) cur = samples.indexOf(added);
  sortSamples();
  renderList();
}

// ---- 発音 ----
// voices：鍵盤ごとに鳴っている音。'p' は Play ボタンと試聴用
const voices = new Map();
let previewTimer = 0, held = false;   // held：Play で鳴らし続けている

function startVoice(s, k, vel) {
  const r = s.buf.sampleRate, src = ctx.createBufferSource();
  const vg = ctx.createGain(), pn = ctx.createStereoPanner(), env = ctx.createGain();
  src.buffer = crushed(s);
  src.playbackRate.value = 2 ** (((k - s.root) * (s.track ?? 1) * 100 + (s.tune || 0)) / 1200);
  vg.gain.value = outGain(s);
  pn.pan.value = (s.pan - 4) / 4;
  env.gain.value = vel * vel;
  src.connect(vg).connect(pn).connect(env).connect(ctx.destination);
  if (s.loop) { src.loop = true; src.loopStart = s.ls / r; src.loopEnd = s.le / r; src.start(0, s.a / r); }
  else src.start(0, s.a / r, (s.b - s.a) / r);
  return { src, vg, pn, env, s };
}

function fadeOut(v, r) {
  const t = ctx.currentTime, g = v.env.gain;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.setTargetAtTime(0, t, r / 6);
  try { v.src.stop(t + r); } catch {}
}

function noteOn(key, k, vel, list) {
  audio();
  noteOff(key, 0.01);
  if (!list.length) return;
  // 排他グループ：同じ番号の音が鳴っていたら止める
  const ex = new Set(list.map(s => s.excl).filter(Boolean));
  if (ex.size) voices.forEach((vs, kk) => {
    const rest = vs.filter(v => !ex.has(v.s.excl));
    if (rest.length === vs.length) return;
    vs.forEach(v => { if (ex.has(v.s.excl)) fadeOut(v, 0.01); });
    if (rest.length) voices.set(kk, rest); else { voices.delete(kk); if (kk === 'p') held = false; }
  });
  const vs = list.map(s => startVoice(s, k, vel));
  voices.set(key, vs);
  vs.forEach(v => v.src.onended = () => {
    const a = voices.get(key), i = a ? a.indexOf(v) : -1;
    if (i < 0) return;
    a.splice(i, 1);
    if (!a.length) { voices.delete(key); if (key === 'p') playState(); }
  });
  if (key === 'p') playState();
}

function noteOff(key, rel) {
  const vs = voices.get(key); if (!vs) return;
  voices.delete(key);
  if (key === 'p') held = false;
  vs.forEach(v => fadeOut(v, rel ?? relOf(v.s)));
  if (key === 'p') playState();
}

const playState = () => $('play').setAttribute('aria-pressed', held && voices.has('p'));

// 試聴：ループする音は少しだけ伸ばして離す
function preview(s) {
  clearTimeout(previewTimer);
  noteOn('p', s.root, 1, [s]);
  if (s.loop) previewTimer = setTimeout(() => noteOff('p'), 1200);
}
// Play：ループする音は押すたびに 鳴らし続ける／離す
function togglePlay() {
  const s = samples[cur]; if (!s) return;
  clearTimeout(previewTimer);
  if (held) noteOff('p');
  else { noteOn('p', s.root, 1, [s]); held = s.loop; playState(); }
}
// 鳴らしたまま調整しているときは、そのまま音に反映する
function liveUpdate(s) {
  const r = s.buf.sampleRate;
  voices.forEach(vs => vs.forEach(v => {
    if (v.s !== s || v.src.buffer !== crushed(s)) return;
    v.vg.gain.value = outGain(s);
    v.pn.pan.value = (s.pan - 4) / 4;
    if (v.src.loop && s.loop) { v.src.loopStart = s.ls / r; v.src.loopEnd = s.le / r; }
    else v.src.loop = false;
  }));
}
const previewUnlessHeld = s => { if (!held) preview(s); };

// ---- 一覧 ----
function row(k, name, cls) {
  const li = document.createElement('li');
  li.tabIndex = 0;
  li.setAttribute('role', 'button');
  li.setAttribute('aria-label', `${k} ${name}`);
  li.innerHTML = `<span class="k"></span><span class="n"></span>`;
  li.firstChild.textContent = k;
  li.lastChild.textContent = name;
  if (cls) li.className = cls;
  return li;
}

function renderList(focusIdx) {
  picking = null;
  const list = $('list');
  list.innerHTML = '';
  if (!samples.length) list.innerHTML = '<li class="empty">音声ファイルかSF2をドロップ</li>';
  samples.forEach((s, i) => {
    const li = row(rangeName(s), s.name);
    li.onfocus = () => select(i);
    li.onclick = () => { if (noClick) return; select(i); preview(s); };
    li.onpointerdown = e => { if (!e.button) { rowDrag = { from: i, y0: e.clientY, on: false, to: i }; li.setPointerCapture(e.pointerId); } };
    li.onpointermove = e => rowMove(li, e);
    li.onpointerup = li.onpointercancel = () => rowDrop(li);
    li.onkeydown = e => {
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
        const to = i + (e.key === 'ArrowUp' ? -1 : 1);
        if (to >= 0 && to < samples.length) swap(i, to, true);
        e.preventDefault();
      }
      else if (e.key === 'Enter' || e.key === ' ') { preview(s); e.preventDefault(); }
      else if (e.key === 'Delete' || e.key === 'Backspace') { remove(i, true); e.preventDefault(); }
      else if (e.key === 'ArrowDown' && li.nextSibling) { li.nextSibling.focus(); e.preventDefault(); }
      else if (e.key === 'ArrowUp' && li.previousSibling) { li.previousSibling.focus(); e.preventDefault(); }
    };
    list.appendChild(li);
  });
  renderPiano();
  if (focusIdx >= 0 && list.children[focusIdx]) list.children[focusIdx].focus();
  $('save').disabled = $('clear').disabled = $('del').disabled = !samples.length;
  select(cur);
}

// 1件削除（ほかの音の鍵盤はそのまま）
function remove(i, focus) {
  if (voices.has('p')) noteOff('p', 0.01);
  samples.splice(i, 1);
  cur = Math.min(i, samples.length - 1);
  renderList(focus ? cur : undefined);
}

// ---- 入れ替え（行を別の行へドラッグ／Alt+↑↓）。2つの音の鍵盤を交換する ----
let rowDrag = null, noClick = false;

function swap(i, j, focus) {
  const p = samples[i], q = samples[j];
  for (const f of ['lo', 'hi', 'root', 'vlo', 'vhi']) [p[f], q[f]] = [q[f], p[f]];
  cur = i;
  sortSamples();
  renderList(focus ? cur : undefined);
}

function rowMove(li, e) {
  const d = rowDrag; if (!d) return;
  if (!d.on && Math.abs(e.clientY - d.y0) < 5) return;
  d.on = true;
  li.classList.add('lift');
  const rows = [...$('list').children];
  d.to = rows.findIndex(el => { const r = el.getBoundingClientRect(); return e.clientY >= r.top && e.clientY < r.bottom; });
  rows.forEach((el, j) => el.classList.toggle('ins', j === d.to && j !== d.from));
}

function rowDrop(li) {
  const d = rowDrag; if (!d) return;
  rowDrag = null;
  if (!d.on) return;
  noClick = true; setTimeout(() => noClick = false);
  li.classList.remove('lift');
  [...$('list').children].forEach(el => el.classList.remove('ins'));
  if (d.to >= 0 && d.to !== d.from) swap(d.from, d.to);
}

function select(i) {
  cur = i;
  if (!picking && samples.length) [...$('list').children].forEach((li, j) => li.classList.toggle('on', j === i));
  pianoEl.querySelectorAll('.sel, .root').forEach(el => el.classList.remove('sel', 'root'));
  const s = samples[i];
  if (s) {
    for (let k = s.lo; k <= s.hi; k++) { const el = keyEl(k); if (el) el.classList.add('sel'); }
    const el = keyEl(s.root);
    if (el) {
      el.classList.add('root');
      // 鍵盤が横にはみ出しているときは、選んだ音が見える位置までずらす
      const x = el.offsetLeft, v = pianoEl.scrollLeft;
      if (x < v || x + WK > v + pianoEl.clientWidth) pianoEl.scrollLeft = x - pianoEl.clientWidth / 2;
    }
  }
  playState();
  draw();
}

// ---- 鍵盤 ----
const pianoEl = $('piano'), WK = 22, BK = 14;
const isBlack = k => [1, 3, 6, 8, 10].includes(k % 12);
const keyEl = k => pianoEl.querySelector(`[data-k="${k}"]`);

// 音が入っている範囲をオクターブ単位で表示（C2から最低2オクターブ）
function renderPiano() {
  const has = new Uint8Array(128);
  samples.forEach(s => has.fill(1, s.lo, s.hi + 1));
  const k0 = Math.min(START_KEY, ...samples.map(s => s.lo - s.lo % 12));
  const k1 = Math.min(127, Math.max(k0 + 23, ...samples.map(s => s.hi - s.hi % 12 + 11)));
  let html = '', wi = 0;
  for (let k = k0; k <= k1; k++) {
    const c = has[k] ? ' has' : '';
    if (isBlack(k)) html += `<div class="b${c}" data-k="${k}" style="left:${wi * WK - BK / 2}px"></div>`;
    else html += `<div class="w${c}" data-k="${k}" style="left:${wi++ * WK}px">${k % 12 ? '' : `<span>${keyName(k)}</span>`}</div>`;
  }
  pianoEl.innerHTML = html;
}

function keyDown(k, vel) {
  if (openDD && openDD.isNote) { openDD.pick(k); return; }   // 鍵盤の選択欄が開いていたら、その鍵盤を選ぶ
  const el = keyEl(k); if (el) el.classList.add('down');
  const v = Math.round(vel * 127);
  const list = samples.filter(s => s.lo <= k && k <= s.hi && s.vlo <= v && v <= s.vhi);
  if (list.length) select(samples.indexOf(list[0]));
  noteOn(k, k, vel, list);
}
function keyUp(k) {
  const el = keyEl(k); if (el) el.classList.remove('down');
  noteOff(k);
}

pianoEl.onpointerdown = e => {
  const el = e.target.closest('[data-k]'); if (!el) return;
  audio();
  const k = +el.dataset.k;
  keyDown(k, 1);
  const up = () => { keyUp(k); removeEventListener('pointerup', up); };
  addEventListener('pointerup', up);
};

// Web MIDI：どのチャンネルのノートでも受ける
let midi = null;
$('midi').onclick = async () => {
  audio();
  if (midi) return;
  if (!navigator.requestMIDIAccess) { $('dev').textContent = 'このブラウザでは使えません'; return; }
  try { midi = await navigator.requestMIDIAccess(); }
  catch { $('dev').textContent = '使用が許可されていません'; return; }
  midi.onstatechange = bindMidi;
  bindMidi();
};
function bindMidi() {
  const names = [];
  midi.inputs.forEach(inp => { inp.onmidimessage = onMidi; if (inp.state === 'connected') names.push(inp.name); });
  $('dev').textContent = names.join(', ') || 'つながっていません';
  $('midi').setAttribute('aria-pressed', true);
}
function onMidi(e) {
  const [st, k, v] = e.data, t = st & 0xF0;
  if (t === 0x90 && v > 0) keyDown(k, v / 127);
  else if (t === 0x80 || t === 0x90) keyUp(k);
}

// ---- 選択欄（元の高さ・鳴らす範囲は高い音が上。排他グループは なし,1,2…）----
let openDD = null;
function dropdown(field, values, label, isNote) {
  const btn = $(field), list = document.createElement('span');
  list.className = 'list'; list.hidden = true;
  list.setAttribute('role', 'listbox'); list.setAttribute('aria-label', btn.getAttribute('aria-label'));
  if (isNote) btn.title = '開いたまま鍵盤やMIDIキーボードを押すと、その鍵盤を選べます';
  values.forEach(v => {
    const o = list.appendChild(document.createElement('button'));
    o.type = 'button'; o.setAttribute('role', 'option'); o.textContent = label(v); o.dataset.v = v;
    o.onclick = () => { pick(v); btn.focus(); };
  });
  btn.after(list);
  const close = () => { list.hidden = true; if (openDD && openDD.list === list) openDD = null; };
  const pick = v => { close(); setField(field, v); };
  const now = () => values.indexOf(samples[cur][field] || 0);
  btn.onclick = () => {
    if (!list.hidden) return close();
    if (openDD) openDD.close();
    if (!samples[cur]) return;
    list.hidden = false;
    openDD = { list, pick, close, isNote };
    const i = now();
    [...list.children].forEach((o, j) => o.setAttribute('aria-selected', j === i));
    const o = list.children[Math.max(0, i)];
    o.scrollIntoView({ block: 'center' }); o.focus({ preventScroll: true });
  };
  // 閉じたまま ↑↓ で一つずつ変える（一覧の上下と同じ向き）
  btn.onkeydown = e => {
    const d = { ArrowUp: -1, ArrowDown: 1 }[e.key];
    if (samples[cur] && d && list.hidden) { setField(field, values[clamp(now() + d, 0, values.length - 1)]); e.preventDefault(); }
  };
  list.onkeydown = e => {
    const f = document.activeElement;
    if (e.key === 'ArrowDown' && f.nextSibling) { f.nextSibling.focus(); e.preventDefault(); }
    if (e.key === 'ArrowUp' && f.previousSibling) { f.previousSibling.focus(); e.preventDefault(); }
    if (e.key === 'Escape') { close(); btn.focus(); }
  };
}
document.addEventListener('pointerdown', e => { if (openDD && !e.target.closest('.dd')) openDD.close(); });

// 1鍵盤だけの音は「元の高さ」を変えると鍵盤ごと移動する
function setField(field, k) {
  const s = samples[cur]; if (!s) return;
  if (field === 'excl') { s.excl = k; return draw(); }
  if (field === 'rate' || field === 'bits' || field === 'lpf') { s[field] = k; draw(); return replayHeld(s); }
  if (field === 'root') { if (s.lo === s.hi && s.hi === s.root) s.lo = s.hi = k; s.root = k; }
  else if (field === 'lo') { s.lo = k; if (s.hi < k) s.hi = k; }
  else { s.hi = k; if (s.lo > k) s.lo = k; }
  sortSamples();
  renderList();
}
const NOTES = [...Array(128).keys()].reverse();
['root', 'lo', 'hi'].forEach(f => dropdown(f, NOTES, keyName, true));
dropdown('excl', [...Array(128).keys()], v => v ? String(v) : 'なし', false);
const rateName = v => v ? v + 'Hz' : '元のまま';
dropdown('rate', [0, 32000, 22050, 16000, 11025, 8000, 6000, 4000], rateName, false);
dropdown('bits', [16, 12, 10, 8, 6, 4], v => v + 'bit', false);
const LPF_NAME = ['なし', '少し', 'ふつう', '強め', 'とても'];
dropdown('lpf', [0, 1, 2, 3, 4], v => LPF_NAME[v], false);

// ---- 波形と切り出し・ループ ----
const cv = $('wave'), cx = cv.getContext('2d');

// 表示範囲（v0〜v1）の列データ。表示範囲が変わったときだけ作り直す
function viewCols(s) {
  const cb = crushed(s), key = s.v0 + ',' + s.v1 + ',' + crushKey(s);
  if (s.ck === key && s.cb === cb) return s.cols;
  s.cb = cb;
  const d = cb.getChannelData(0), n = d.length, len = s.v1 - s.v0;
  const out = s.cols || new Float32Array(W * 2);
  for (let x = 0; x < W; x++) {
    const i0 = s.v0 + Math.floor(x * len / W), i1 = Math.max(i0 + 1, s.v0 + Math.floor((x + 1) * len / W));
    let lo = Infinity, hi = -Infinity;
    for (let i = Math.max(0, i0 - 1); i < i1 && i < n; i++) { const v = d[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
    if (lo === Infinity) lo = hi = 0;
    out[x * 2] = lo; out[x * 2 + 1] = hi;
  }
  s.cols = out; s.ck = key;
  return out;
}

function setView(s, v0, v1) {
  const n = s.buf.length, len = clamp(v1 - v0, Math.min(n, W / 2), n);
  s.v0 = Math.round(clamp(v0, 0, n - len));
  s.v1 = Math.round(s.v0 + len);
}
// キーボードで動かした端が画面外に出たら表示を追いかける
function follow(s, f) {
  const len = s.v1 - s.v0;
  if (f < s.v0) setView(s, f - len * 0.1, f + len * 0.9);
  else if (f > s.v1) setView(s, f - len * 0.9, f + len * 0.1);
}
// ループ範囲を切り出し範囲の中に収める
function fixLoop(s) {
  if (s.ls == null) return;
  s.ls = clamp(s.ls, s.a, s.b - MIN_LEN);
  s.le = clamp(s.le, s.ls + MIN_LEN, s.b);
}

function draw() {
  const s = samples[cur];
  $('ed').hidden = !s || !!picking;
  if (!s) return;
  const cols = viewCols(s), g = outGain(s), len = s.v1 - s.v0;
  const X = f => (f - s.v0) / len * W, xa = X(s.a), xb = X(s.b);
  const line = (x, c) => { if (x >= 0 && x <= W) { cx.fillStyle = c; cx.fillRect(Math.min(W - 1, Math.round(x)), 0, 1, H); } };
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H);
  if (s.loop) { cx.fillStyle = 'rgba(47,111,222,.12)'; cx.fillRect(X(s.ls), 0, X(s.le) - X(s.ls), H); }
  cx.fillStyle = LINE; cx.fillRect(0, H / 2, W, 1);
  for (let x = 0; x < W; x++) {
    const lo = clamp(cols[x * 2] * g, -1, 1), hi = clamp(cols[x * 2 + 1] * g, -1, 1);
    const y0 = (1 - hi) * H / 2, y1 = (1 - lo) * H / 2;
    cx.fillStyle = x + 1 > xa && x < xb ? INK : LINE;
    cx.fillRect(x, y0, 1, Math.max(1, y1 - y0));
  }
  line(xa, INK); line(xb, INK);
  if (s.loop) {
    for (const f of [s.ls, s.le]) { const x = X(f); line(x, ACC); cx.fillRect(Math.round(x) - 3, H - 8, 8, 8); }
  }
  $('len').textContent = ((s.b - s.a) / s.buf.sampleRate).toFixed(3) + '秒';
  $('hint').innerHTML = 'ドラッグで使う範囲を選ぶ／黒い線をドラッグで端を調整／ホイールで拡大'
    + (s.loop ? '<br>青い部分は鍵盤を押している間くり返し鳴ります。下の■をドラッグで端を調整' : '');
  $('norm').setAttribute('aria-pressed', s.norm);
  $('loop').setAttribute('aria-pressed', s.loop);
  for (const f of ['root', 'lo', 'hi']) $(f).textContent = keyName(s[f]);
  $('rate').textContent = rateName(s.rate);
  $('bits').textContent = s.bits + 'bit';
  $('lpf').textContent = LPF_NAME[s.lpf || 0];
  for (const id in LOOKS) { const [r, b, l] = LOOKS[id]; $(id).setAttribute('aria-pressed', (s.rate || 0) === r && s.bits === b && (s.lpf || 0) === l); }
  $('excl').textContent = s.excl ? s.excl : 'なし';
  volCells.forEach((c, k) => c.classList.toggle('on', k <= s.vol));
  $('vol').setAttribute('aria-valuenow', s.vol + 1);
  $('db').textContent = VOL_DB[s.vol] + 'dB';
  // パンは中央から今の位置までを黒くする
  const p = s.pan - 4;
  panCells.forEach((c, k) => { const v = k - 4; c.classList.toggle('on', v === 0 || (p < 0 ? v >= p && v < 0 : v <= p && v > 0)); });
  $('pan').setAttribute('aria-valuenow', p);
  $('lr').textContent = p ? (p < 0 ? '左' : '右') + Math.abs(p) : '中央';
  liveUpdate(s);
}

// ---- 段階バー（音量・パン）。離したとき・キーで変えたときに試聴 ----
function stepBar(el, n, key) {
  const cells = [...Array(n)].map(() => el.appendChild(document.createElement('i')));
  const set = i => {
    const s = samples[cur]; if (!s) return false;
    i = clamp(i, 0, n - 1);
    if (i === s[key]) return false;
    s[key] = i; draw();
    return true;
  };
  const fromX = e => { const r = el.getBoundingClientRect(); set(Math.floor((e.clientX - r.left) / r.width * n)); };
  el.onpointerdown = e => { el.setPointerCapture(e.pointerId); fromX(e); };
  el.onpointermove = e => { if (el.hasPointerCapture(e.pointerId)) fromX(e); };
  el.onpointerup = () => samples[cur] && previewUnlessHeld(samples[cur]);
  el.onkeydown = e => {
    const s = samples[cur]; if (!s) return;
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (d) { if (set(s[key] + d)) previewUnlessHeld(s); e.preventDefault(); }
  };
  return cells;
}
const volCells = stepBar($('vol'), VOL_DB.length, 'vol');
const panCells = stepBar($('pan'), 9, 'pan');   // L4〜C〜R4

// 波形の下の方（青い四角のあたり）はループの端を、上の方は切り出しの端を優先してつかむ
const edgeAt = (s, px, py, r) => {
  const len = s.v1 - s.v0, near = f => Math.abs(px - (f - s.v0) / len * r.width) <= 6;
  const trim = ['a', 'b'], loop = s.loop ? ['ls', 'le'] : [];
  const order = py > r.height * 0.66 ? [...loop, ...trim] : [...trim, ...loop];
  return order.find(f => near(s[f])) || null;
};

cv.onpointerdown = e => {
  const s = samples[cur]; if (!s) return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, v0 = s.v0, len = s.v1 - s.v0;
  const fx = v => Math.round(v0 + clamp(v / r.width, 0, 1) * len);
  drag = { mode: edgeAt(s, px, e.clientY - r.top, r) || 'new', x0: px, f0: fx(px), moved: false, r, fx };
  cv.setPointerCapture(e.pointerId);
};
cv.onpointermove = e => {
  const s = samples[cur]; if (!s) return;
  const r = drag ? drag.r : cv.getBoundingClientRect(), px = e.clientX - r.left;
  if (!drag) { cv.style.cursor = edgeAt(s, px, e.clientY - r.top, r) ? 'ew-resize' : 'crosshair'; return; }
  if (!drag.moved && Math.abs(px - drag.x0) < 3) return;
  drag.moved = true;
  const n = s.buf.length, f = drag.fx(px);
  if (drag.mode === 'ls') s.ls = clamp(f, s.a, s.le - MIN_LEN);
  else if (drag.mode === 'le') s.le = clamp(f, s.ls + MIN_LEN, s.b);
  else {
    if (drag.mode === 'a') s.a = clamp(f, 0, s.b - MIN_LEN);
    else if (drag.mode === 'b') s.b = clamp(f, s.a + MIN_LEN, n);
    else {
      s.a = Math.min(drag.f0, f); s.b = Math.max(drag.f0, f);
      if (s.b - s.a < MIN_LEN) { s.b = Math.min(n, s.a + MIN_LEN); s.a = Math.max(0, s.b - MIN_LEN); }
    }
    fixLoop(s);
  }
  draw();
};
cv.onpointerup = () => { if (!drag) return; const moved = drag.moved; drag = null; if (moved) previewUnlessHeld(samples[cur]); };

// ホイール：拡大縮小（マウス位置中心）／ Shift+ホイール・横スクロール：左右移動
cv.addEventListener('wheel', e => {
  const s = samples[cur]; if (!s) return;
  e.preventDefault();
  const r = cv.getBoundingClientRect(), len = s.v1 - s.v0;
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    const d = (e.deltaX || e.deltaY) / r.width * len;
    setView(s, s.v0 + d, s.v1 + d);
  } else {
    const f = s.v0 + clamp((e.clientX - r.left) / r.width, 0, 1) * len, k = e.deltaY > 0 ? 1.25 : 0.8;
    setView(s, f - (f - s.v0) * k, f + (s.v1 - f) * k);
  }
  draw();
}, { passive: false });

// ←→ 開始 / Shift+←→ 終了 / Alt+←→ ループ開始 / Alt+Shift+←→ ループ終了（1画素ずつ）/ Space 再生
cv.onkeydown = e => {
  const s = samples[cur]; if (!s) return;
  const n = s.buf.length, step = Math.max(1, Math.round((s.v1 - s.v0) / W)), d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (d) {
    if (e.altKey && s.loop) {
      if (e.shiftKey) { s.le = clamp(s.le + d * step, s.ls + MIN_LEN, s.b); follow(s, s.le); }
      else { s.ls = clamp(s.ls + d * step, s.a, s.le - MIN_LEN); follow(s, s.ls); }
    }
    else if (e.shiftKey) { s.b = clamp(s.b + d * step, s.a + MIN_LEN, n); follow(s, s.b); fixLoop(s); }
    else { s.a = clamp(s.a + d * step, 0, s.b - MIN_LEN); follow(s, s.a); fixLoop(s); }
    draw(); e.preventDefault();
  } else if (e.key === ' ' || e.key === 'Enter') { togglePlay(); e.preventDefault(); }
};

$('play').onclick = togglePlay;
$('norm').onclick = () => { const s = samples[cur]; if (s) { s.norm = !s.norm; draw(); replayHeld(s); } };
$('crushAll').onclick = () => {
  const s = samples[cur]; if (!s) return;
  samples.forEach(o => { o.rate = s.rate; o.bits = s.bits; o.lpf = s.lpf; });
  draw();
};
// ワンタッチ設定：[サンプリング, ビット数, こもり]
const LOOKS = { pSnes: [16000, 12, 2], p64: [22050, 12, 3], pDs: [22050, 8, 0], pOrig: [0, 16, 0] };
for (const id in LOOKS) $(id).onclick = () => {
  const s = samples[cur]; if (!s) return;
  [s.rate, s.bits, s.lpf] = LOOKS[id];
  draw(); replayHeld(s);
};
// 鳴らし続けている音は、波形を作り直したら鳴らし直す
function replayHeld(s) { if (held) { noteOn('p', s.root, 1, [s]); held = s.loop; playState(); } }
$('loop').onclick = () => {
  const s = samples[cur]; if (!s) return;
  noteOff('p', 0.05);
  s.loop = !s.loop;
  if (s.loop && s.ls == null) { s.ls = Math.round(s.a + (s.b - s.a) / 2); s.le = s.b; }
  fixLoop(s);
  draw();
};
$('zoom').onclick = () => { const s = samples[cur]; if (s) { const m = (s.b - s.a) * 0.1; setView(s, s.a - m, s.b + m); draw(); } };
$('del').onclick = () => { if (samples[cur]) remove(cur); };
$('all').onclick = () => { const s = samples[cur]; if (s) { setView(s, 0, s.buf.length); draw(); } };

// ---- ファイル操作 ----
$('open').onclick = () => $('files').click();
$('files').onchange = e => { add([...e.target.files]); e.target.value = ''; };
$('clear').onclick = () => { noteOff('p', 0.01); samples = []; cur = -1; meta = {}; source = null; updateSrc(); renderList(); };
$('pickBtn').onclick = () => showPicker();
$('save').onclick = () => {
  const blob = new Blob([buildSF2(samples, meta)], { type: 'application/octet-stream' });

let dragN = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); if (dragN++ === 0) document.body.classList.add('drag'); });
document.addEventListener('dragleave', () => { if (--dragN === 0) document.body.classList.remove('drag'); });

  e.preventDefault(); dragN = 0; document.body.classList.remove('drag');
  add([...e.dataTransfer.files].filter(f => f.type.startsWith('audio/') || /\.(wav|mp3|ogg|flac|m4a|aac|aif|aiff|sf2)$/i.test(f.name)));
});

renderList();

// ---- SF2 読み込み ----

async function openSF2(file) {
  let sf;
  try { sf = parseSF2(await file.arrayBuffer()); } catch { alert(`読み込めませんでした：${file.name}`); return; }
  if (!sf.presets.length) { alert('楽器が入っていません'); return; }
  if (samples.length && !confirm('今の音を消して、このSF2を開きますか？')) return;
  noteOff('p', 0.01);
  source = { sf, preset: null, cache: new Map() };
  samples = []; cur = -1; meta = {};
  updateSrc();
  if (sf.presets.length === 1) return loadPreset(sf.presets[0]);
  showPicker();
}

function updateSrc() {
  $('pickBtn').hidden = !(source && source.sf.presets.length > 1);
  $('srcName').textContent = source && source.preset ? source.preset.name : '';
}

// 楽器が複数あるときは、一覧の場所に選択肢を出す
function showPicker() {
  if (!source) return;
  const sf = source.sf;
  picking = sf;
  noteOff('p', 0.01);
  const list = $('list');
  list.innerHTML = '';
  const add = (li, fn) => {
    li.onclick = fn;
    li.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { fn(); e.preventDefault(); }
      else if (e.key === 'Escape') renderList();
      else if (e.key === 'ArrowDown' && li.nextSibling) { li.nextSibling.focus(); e.preventDefault(); }
      else if (e.key === 'ArrowUp' && li.previousSibling) { li.previousSibling.focus(); e.preventDefault(); }
    };
    list.appendChild(li);
  };
  if (source.preset) add(row('', '戻る', 'back'), () => renderList());
  let on = null;
  [...sf.presets].sort((p, q) => p.bank - q.bank || p.prog - q.prog).forEach(p => {
    const li = row(`${p.bank}:${p.prog}`, p.name, p === source.preset ? 'on' : '');
    if (p === source.preset) on = li;
    add(li, () => loadPreset(p));
  });
  draw();
  const f = on || list.querySelector('li:not(.back)');
  if (f) { f.focus(); f.scrollIntoView({ block: 'center' }); }
}

function parseSF2(ab) {
  const dv = new DataView(ab), u8 = new Uint8Array(ab);
  const id = o => String.fromCharCode(u8[o], u8[o + 1], u8[o + 2], u8[o + 3]);
  if (id(0) !== 'RIFF' || id(8) !== 'sfbk') throw 0;
  const ck = {};
  const walk = (o, end) => {
    while (o + 8 <= end) {
      const t = id(o), n = dv.getUint32(o + 4, true);

      o += 8 + n + (n & 1);

  for (const t of ['smpl', 'phdr', 'pbag', 'pgen', 'inst', 'ibag', 'igen', 'shdr']) if (!ck[t]) throw 0;
  const recs = (t, size, f) => { const c = ck[t], out = []; for (let o = c.o; o + size <= c.o + c.n; o += size) out.push(f(o)); return out; };
  const str = (o, n) => { let s = ''; for (let i = 0; i < n && u8[o + i]; i++) s += String.fromCharCode(u8[o + i]); return s.trim(); };
  const bags = t => recs(t, 4, o => dv.getUint16(o, true));
  const gens = t => recs(t, 4, o => ({ op: dv.getUint16(o, true), u: dv.getUint16(o + 2, true), s: dv.getInt16(o + 2, true) }));
  const phdr = recs('phdr', 38, o => ({ name: str(o, 20), prog: dv.getUint16(o + 20, true), bank: dv.getUint16(o + 22, true), bag: dv.getUint16(o + 24, true) }));
  const sm = ck.smpl;
  return {
    presets: phdr.slice(0, -1).map((p, i) => ({ ...p, end: phdr[i + 1].bag })),
    pbag: bags('pbag'), pgen: gens('pgen'), ibag: bags('ibag'), igen: gens('igen'),
    inst: recs('inst', 22, o => ({ name: str(o, 20), bag: dv.getUint16(o + 20, true) })),
    shdr: recs('shdr', 46, o => ({ name: str(o, 20), start: dv.getUint32(o + 20, true), end: dv.getUint32(o + 24, true),
      ls: dv.getUint32(o + 28, true), le: dv.getUint32(o + 32, true), rate: dv.getUint32(o + 36, true),
      pitch: u8[o + 40], corr: dv.getInt8(o + 41), type: dv.getUint16(o + 44, true) })),
    smpl: sm.o & 1 ? new Int16Array(ab.slice(sm.o, sm.o + (sm.n & ~1))) : new Int16Array(ab, sm.o, sm.n >> 1),
  };
}

// ゾーンごとのジェネレーター（番号→値）。先頭が対象を持たないゾーンなら全体設定として分ける
function zones(bag, gen, b0, b1, target) {
  const z = [];
  for (let b = b0; b < b1; b++) {
    const g = {};
    for (let j = bag[b]; j < bag[b + 1] && j < gen.length; j++) g[gen[j].op] = gen[j];
    z.push(g);
  }
  const glob = z.length && !(target in z[0]) ? z.shift() : {};
  return { glob, list: z.filter(g => target in g) };
}

// プリセット → 楽器 → サンプルをたどって、鍵盤の範囲ごとの音に平たくする
// 読み込むのは 範囲・ベロシティ範囲・音量・パン・チューニング・リリース・ループ。それ以外の音色設定は省く
function loadPreset(p) {
  audio();
  noteOff('p', 0.01);
  if (p === source.preset) return renderList();
  // 今の楽器の編集内容を残してから切り替える。前に開いた楽器は残しておいた内容に戻す
  if (source.preset) source.cache.set(source.preset, { samples, cur });
  const c = source.cache.get(p);
  if (c) return showPreset(p, c.samples, c.cur);
  const sf = source.sf;
  const P = zones(sf.pbag, sf.pgen, p.bag, p.end, 41), out = [], bufs = new Map();
  for (const pz of P.list) {
    const pg = { ...P.glob, ...pz }, ii = pg[41].u, ins = sf.inst[ii], next = sf.inst[ii + 1];
    if (!ins || !next) continue;
    const I = zones(sf.ibag, sf.igen, ins.bag, next.bag, 53);
    for (const iz of I.list) {
      const ig = { ...I.glob, ...iz };
      const n = op => ig[op] ? ig[op].s : 0, pn = op => pg[op] ? pg[op].s : 0;
      const range = op => { let lo = 0, hi = 127; for (const r of [ig[op], pg[op]]) if (r) { lo = Math.max(lo, r.u & 255); hi = Math.min(hi, r.u >> 8); } return [lo, hi]; };
      const [lo, hi] = range(43), [vlo, vhi] = range(44);
      const sh = sf.shdr[ig[53].u];
      if (lo > hi || vlo > vhi || !sh || sh.type & 0x8000) continue;
      const st = sh.start + n(0) + n(4) * 32768, en = sh.end + n(1) + n(12) * 32768;
      if (st < 0 || en > sf.smpl.length || en - st < MIN_LEN) continue;
      const bk = st + ',' + en + ',' + sh.rate;
      let buf = bufs.get(bk);
      if (!buf) {
        buf = ctx.createBuffer(1, en - st, clamp(sh.rate || 44100, 3000, 384000));
        const d = buf.getChannelData(0);
        for (let i = 0; i < en - st; i++) d[i] = sf.smpl[st + i] / 32768;
        bufs.set(bk, buf);
      }
      const rk = ig[58] ? ig[58].s : -1, root = rk >= 0 && rk <= 127 ? rk : sh.pitch <= 127 ? sh.pitch : 60;
      const s = item(sh.name || ins.name || 'Sample', buf, lo);
      Object.assign(s, {
        lo, hi, root, vlo, vhi,
        vol: clamp(Math.round((27 - (n(48) + pn(48)) / 10) / 3), 0, 9),
        pan: clamp(Math.round((n(17) + pn(17)) / 125), -4, 4) + 4,
        tune: (n(51) + pn(51)) * 100 + n(52) + pn(52) + sh.corr,
        track: ((ig[56] ? ig[56].s : 100) + pn(56)) / 100,
        excl: n(57),
        rel: clamp(2 ** (((ig[38] ? ig[38].s : -12000) + pn(38)) / 1200), 0.001, 20),
        loop: ((ig[54] ? ig[54].u : 0) & 1) === 1,
        ls: sh.ls + n(2) + n(45) * 32768 - st,
        le: sh.le + n(3) + n(50) * 32768 - st,
      });
      if (!(s.ls >= 0 && s.le <= s.b && s.le - s.ls >= MIN_LEN)) { if (s.loop) fixLoop(s); else s.ls = s.le = null; }
      out.push(s);
    }
  }
  if (!out.length) { alert('この楽器には音が入っていません'); return; }
  showPreset(p, out, 0);
}
function showPreset(p, list, i) {
  source.preset = p;
  samples = list; cur = i; meta = { name: p.name, bank: p.bank, prog: p.prog };
  sortSamples();
  updateSrc();
  renderList();
}

// ---- SF2 書き出し ----
// 音量 × ノーマライズ（切り出した範囲のピークを 0.99 にそろえる倍率。範囲が変わったときだけ計算）
function gain(s) {
  let g = 10 ** (VOL_DB[s.vol ?? 9] / 20);
  if (!s.norm) return g;
  const key = s.a + ',' + s.b;
  if (s.gk !== key) {
    const d = s.buf.getChannelData(0); let p = 0;
    for (let i = s.a; i < s.b; i++) { const v = Math.abs(d[i]); if (v > p) p = v; }
    s.g = p > 0 ? 0.99 / p : 1; s.gk = key;
  }
  return g * s.g;
}

// ---- 音の粗さ ----
// サンプリング：指定のレートの1区間ごとに平均をとり、その値を区間いっぱいに並べる（補間なしで鳴らした昔の機械の音）
// ビット数：音量の段階を減らす。ノーマライズした後の大きさで刻み、音量はそのあとでかける
// こもり：刻んだあとに高い音を削り、段差の角を丸める（スーファミの音のなめらかにし方に近い）
// 作った波形は 元の波形・設定ごとに使い回す
const crushCache = new WeakMap();
const crushKey = s => (s.rate || 0) + ',' + (s.bits || 16) + ',' + (s.lpf || 0) + ',' + (s.norm ? s.a + ':' + s.b : '');
const LPF_K = [0, 0.8, 0.55, 0.38, 0.25];   // 刻んだレートの上限（半分）に対する、残す高さの割合
function crushed(s) {
  const src = s.buf, r = src.sampleRate, rate = s.rate && s.rate < r ? s.rate : 0, bits = s.bits || 16;
  const lpf = s.lpf || 0;
  if (!rate && bits >= 16 && !lpf) return src;
  const key = rate + ',' + bits + ',' + lpf + ',' + normGain(s);
  let m = crushCache.get(src);
  if (!m) crushCache.set(src, m = new Map());
  if (m.has(key)) return m.get(key);
  const d = src.getChannelData(0), n = d.length, out = ctx.createBuffer(1, n, r), o = out.getChannelData(0);
  const ng = normGain(s), q = 2 ** (bits - 1), step = rate ? r / rate : 1;
  for (let j = 0; ; j++) {
    const i0 = Math.floor(j * step), i1 = Math.min(n, Math.max(i0 + 1, Math.floor((j + 1) * step)));
    if (i0 >= n) break;
    let v = 0; for (let i = i0; i < i1; i++) v += d[i];
    v = clamp(v / (i1 - i0) * ng, -1, 1);
    if (bits < 16) v = Math.round(v * q) / q;
    for (let i = i0; i < i1; i++) o[i] = v;
  }
  if (lpf) {
    // 2次のローパス（RBJ）。切る高さは 刻んだレート（元のままなら元のレート）を基準にする
    const fc = Math.min((rate || r) / 2 * LPF_K[lpf], r * 0.45), w = 2 * Math.PI * fc / r, cs = Math.cos(w), al = Math.sin(w) / Math.SQRT2, a0 = 1 + al;
    const b0 = (1 - cs) / 2 / a0, b1 = (1 - cs) / a0, a1 = -2 * cs / a0, a2 = (1 - al) / a0;
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < n; i++) {
      const x = o[i], y = b0 * x + b1 * x1 + b0 * x2 - a1 * y1 - a2 * y2;
      x2 = x1; x1 = x; y2 = y1; y1 = y; o[i] = y;
    }
  }
  if (m.size > 8) m.clear();
  m.set(key, out);
  return out;
}
const isCrushed = s => crushed(s) !== s.buf;
// 鳴らすときにかける倍率（粗くした波形にはノーマライズが入っているので音量だけ）
const outGain = s => isCrushed(s) ? 10 ** (VOL_DB[s.vol ?? 9] / 20) : gain(s);
const normGain = s => s.norm ? gain(s) / 10 ** (VOL_DB[s.vol ?? 9] / 20) : 1;

function pcm16(s) {
  const d = crushed(s).getChannelData(0).subarray(s.a, s.b), g = outGain(s), out = new Int16Array(d.length);
  for (let i = 0; i < d.length; i++) out[i] = Math.round(clamp(d[i] * g, -1, 1) * 32767);
  return out;
}

const ascii = s => s.replace(/[^\x20-\x7E]/g, '_');
const concat = arrs => {
  const out = new Uint8Array(arrs.reduce((n, a) => n + a.length, 0));
  let o = 0; for (const a of arrs) { out.set(a, o); o += a.length; }
  return out;
};
const str4 = s => new Uint8Array([...s].map(c => c.charCodeAt(0)));
const u32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, v, true); return b; };
const chunk = (id, data) => concat([str4(id), u32(data.length), data, new Uint8Array(data.length % 2)]);
const riffList = (type, chunks) => chunk('LIST', concat([str4(type), ...chunks]));
const rec = (size, fill) => { const b = new Uint8Array(size); fill(new DataView(b.buffer), b); return b; };
const zstr = s => {
  const a = ascii(s); const b = new Uint8Array(a.length + 1 + ((a.length + 1) % 2));
  for (let i = 0; i < a.length; i++) b[i] = a.charCodeAt(i);
  return b;
};
const name20 = s => {
  const a = ascii(s).slice(0, 19); const b = new Uint8Array(20);
  for (let i = 0; i < a.length; i++) b[i] = a.charCodeAt(i);
  return b;
};
// 日本語だけの名前は「_」だらけになるので番号名にする
const sampleName = (s, i) => /[A-Za-z0-9]/.test(ascii(s)) ? s : `Sample ${i + 1}`;
const gen = (op, amt) => rec(4, dv => { dv.setUint16(0, op, true); dv.setUint16(2, amt & 0xFFFF, true); });
const bag = (g, m) => rec(4, dv => { dv.setUint16(0, g, true); dv.setUint16(2, m, true); });

function buildSF2(samples, meta = {}) {
  // サンプルデータ。同じ波形・同じ切り出し・同じ音量のものは1つにまとめる（各サンプルの後ろに46点の無音）
  const ids = new WeakMap(), uniq = new Map(), pcm = [], hdr = [];
  let offset = 0;
  let nb = 0; const bufId = b => { if (!ids.has(b)) ids.set(b, nb++); return ids.get(b); };
  const sid = samples.map((s, i) => {
    const key = [bufId(s.buf), s.a, s.b, s.norm, s.vol, s.rate, s.bits, s.lpf, s.loop ? s.ls + ':' + s.le : ''].join(',');
    if (uniq.has(key)) return uniq.get(key);
    const m = pcm16(s), start = offset, end = offset + m.length, pad = m.length >= 32 ? 8 : 0;
    hdr.push({ name: sampleName(s.name, i), start, end, rate: s.buf.sampleRate, root: s.root,
      ls: s.loop ? start + s.ls - s.a : start + pad,     // ループしない音も、ループ点は端から8点内側に置く（仕様の推奨）
      le: s.loop ? start + s.le - s.a : end - pad });
    pcm.push(new Uint8Array(m.buffer), new Uint8Array(46 * 2));
    offset = end + 46;
    uniq.set(key, hdr.length - 1);
    return hdr.length - 1;
  });

  const name = meta.name || 'Sounds';
  const info = riffList('INFO', [
    chunk('ifil', rec(4, dv => { dv.setUint16(0, 2, true); dv.setUint16(2, 1, true); })),
    chunk('isng', zstr('EMU8000')),
    chunk('INAM', zstr(name)),
  ]);
  const sdta = riffList('sdta', [chunk('smpl', concat(pcm))]);

  // プリセット1つ → 楽器1つ → 音ごとに1ゾーン
  const phdr = (nm, bagNdx, prog = 0, bank = 0) => rec(38, (dv, b) => { b.set(name20(nm)); dv.setUint16(20, prog, true); dv.setUint16(22, bank, true); dv.setUint16(24, bagNdx, true); });
  const inst = (nm, bagNdx) => rec(22, (dv, b) => { b.set(name20(nm)); dv.setUint16(20, bagNdx, true); });

  const ibags = [], igens = [];
  samples.forEach((s, i) => {
    // 並び順は仕様どおり keyRange → velRange が先頭、sampleID が最後
    const g = [gen(43, s.lo | s.hi << 8)];
    if (s.vlo > 0 || s.vhi < 127) g.push(gen(44, s.vlo | s.vhi << 8));
    if (s.pan !== 4) g.push(gen(17, (s.pan - 4) * 125));
    const tune = Math.round(s.tune || 0), coarse = Math.trunc(tune / 100), fine = tune - coarse * 100;
    if (coarse) g.push(gen(51, coarse));
    if (fine) g.push(gen(52, fine));
    if ((s.track ?? 1) !== 1) g.push(gen(56, Math.round(s.track * 100)));
    if (s.excl) g.push(gen(57, s.excl));
    g.push(gen(38, clamp(Math.round(1200 * Math.log2(relOf(s))), -12000, 8000)));
    if (s.loop) g.push(gen(54, 1));
    g.push(gen(58, s.root), gen(53, sid[i]));
    ibags.push(bag(igens.length, 0));
    igens.push(...g);
  });
  ibags.push(bag(igens.length, 0));
  igens.push(gen(0, 0));

  const shdrs = hdr.map(h => rec(46, (dv, b) => {
    b.set(name20(h.name));
    dv.setUint32(20, h.start, true); dv.setUint32(24, h.end, true);
    dv.setUint32(28, h.ls, true); dv.setUint32(32, h.le, true);
    dv.setUint32(36, h.rate, true);
    dv.setUint8(40, h.root); dv.setUint16(44, 1, true);
  }));
  shdrs.push(rec(46, (dv, b) => b.set(name20('EOS'))));

  const pdta = riffList('pdta', [
    chunk('phdr', concat([phdr(name, 0, meta.prog, meta.bank), phdr('EOP', 1)])),
    chunk('pbag', concat([bag(0, 0), bag(1, 0)])),
    chunk('pmod', new Uint8Array(10)),
    chunk('pgen', concat([gen(41, 0), gen(0, 0)])),
    chunk('inst', concat([inst(name, 0), inst('EOI', samples.length)])),
    chunk('ibag', concat(ibags)),
    chunk('imod', new Uint8Array(10)),
    chunk('igen', concat(igens)),
    chunk('shdr', concat(shdrs)),
  ]);

  return chunk('RIFF', concat([str4('sfbk'), info, sdta, pdta]));
}
