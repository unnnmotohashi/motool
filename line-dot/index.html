  :root { --bg:#e6e8eb; --panel:#ffffff; --ink:#1d2127; --sub:#6b7380; --line:#c9ced6; --accent:#2f6fde; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"KHDot", system-ui, sans-serif; background:var(--bg); color:var(--ink); font-size:12px; line-height:1; -webkit-font-smoothing:none; font-smooth:never; }
  header { display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  .top { color:var(--sub); text-decoration:none; }
  .top:hover { color:var(--ink); }
  label { display:flex; align-items:center; gap:6px; color:var(--sub); }
  .dd { position:relative; }
  #maxBtn { width:64px; text-align:left; padding:6px 8px; }
  #maxBtn::after { content:"▼"; float:right; }
  .list { position:absolute; top:100%; left:0; z-index:10; width:64px; max-height:240px; overflow:auto; background:#fff; border:1px solid var(--ink); }
  .list button { display:block; width:100%; text-align:left; border:0; border-radius:0; background:#fff; padding:5px 8px; }
  .list button:hover, .list button:focus-visible { background:var(--ink); color:#fff; outline:0; }
  .list button[aria-selected=true] { font-weight:normal; text-decoration:underline; }
  input[type=number] { width:64px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; font:inherit; color:var(--ink); }
  .bar { display:flex; gap:2px; padding:2px; cursor:pointer; touch-action:none; }
  .bar i { width:12px; height:18px; border:1.5px solid var(--ink); background:#fff; }
  .bar i.on { background:var(--ink); }
  button, .file { padding:6px 12px; border:1px solid var(--line); border-radius:4px; background:#f5f6f8; font:inherit; color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  .file input { display:none; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; min-height:calc(100vh - 56px); }
  @media (max-width:700px){ main { grid-template-columns:1fr; } }
  .view { background:var(--panel); border:1px solid var(--line); border-radius:4px; display:flex; align-items:center; justify-content:center; overflow:auto; min-height:300px; padding:12px; }
  .view.drop { outline:2px dashed var(--accent); outline-offset:-8px; }
  #src { max-width:100%; max-height:80vh; }
  #out { image-rendering:pixelated; background:
    conic-gradient(#ddd 25%, #fff 0 50%, #ddd 0 75%, #fff 0) 0 0/16px 16px; }
  .empty { color:var(--sub); }
</style>
</head>
<body>
<header>
  <a class="top" href="../">Top</a>
  <label class="file">Open<input type="file" id="file" accept="image/*"></label>
  <label>Size <span class="dd"><button type="button" id="maxBtn" aria-haspopup="listbox"></button><span class="list" id="maxList" role="listbox" hidden></span></span> <span id="size"></span></label>
  <label>Black <span class="bar" id="th" role="slider" tabindex="0" aria-label="Black"></span></label>
  <label>Pick <span class="bar" id="cov" role="slider" tabindex="0" aria-label="Pick"></span></label>
  <button class="primary" id="save" disabled>Save</button>
</header>
<main>
  <div class="view" id="dropArea"><span class="empty" id="hint">Drop image</span><img id="src" hidden alt=""></div>
  <div class="view"><canvas id="out" hidden></canvas></div>
</main>
<script>
const $ = id => document.getElementById(id);
const srcImg = $('src'), out = $('out'), octx = out.getContext('2d');
let dark = null, SW = 0, SH = 0, integral = null;

function loadFile(f){
  if (!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f);
  srcImg.onload = () => {
    $('hint').hidden = true; srcImg.hidden = false;
    // 解析用に最大2048pxへ縮める
    const s = Math.min(1, 2048 / Math.max(srcImg.naturalWidth, srcImg.naturalHeight));
    SW = Math.round(srcImg.naturalWidth * s); SH = Math.round(srcImg.naturalHeight * s);
    const c = document.createElement('canvas'); c.width = SW; c.height = SH;
    const cx = c.getContext('2d'); cx.drawImage(srcImg, 0, 0, SW, SH);
    dark = cx.getImageData(0, 0, SW, SH).data;
    buildIntegral(); render();
    $('save').disabled = false;
  };
  srcImg.src = url;
}

function buildIntegral(){
  const th = +$('th').value;
  integral = new Uint32Array((SW + 1) * (SH + 1));
  for (let y = 0; y < SH; y++){
    let row = 0;
    for (let x = 0; x < SW; x++){
      const i = (y * SW + x) * 4;
      const lum = 0.299*dark[i] + 0.587*dark[i+1] + 0.114*dark[i+2];
      if (dark[i+3] > 128 && lum < th) row++;
      integral[(y+1)*(SW+1) + x+1] = integral[y*(SW+1) + x+1] + row;
    }
  }
}

function render(){
  if (!integral) return;
  const M = maxSize;
  const W = SW >= SH ? M : Math.max(1, Math.round(M * SW / SH));
  const H = SH >= SW ? M : Math.max(1, Math.round(M * SH / SW));
  $('size').textContent = `${W}×${H}`;
  const cov = +$('cov').value / 100;
  out.width = W; out.height = H;
  const img = octx.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++){
    const y0 = Math.floor(y * SH / H), y1 = Math.max(y0 + 1, Math.floor((y+1) * SH / H));
    for (let x = 0; x < W; x++){
      const x0 = Math.floor(x * SW / W), x1 = Math.max(x0 + 1, Math.floor((x+1) * SW / W));
      const n = integral[y1*(SW+1)+x1] - integral[y0*(SW+1)+x1] - integral[y1*(SW+1)+x0] + integral[y0*(SW+1)+x0];
      if (n / ((x1-x0)*(y1-y0)) >= cov){ d[(y*W+x)*4+3] = 255; }
    }
  }
  octx.putImageData(img, 0, 0);
  out.hidden = false;
  // 表示は整数倍で拡大
  const box = out.parentElement;
  const z = Math.max(1, Math.floor(Math.min((box.clientWidth-24)/W, (box.clientHeight-24)/H)));
  out.style.width = W*z + 'px'; out.style.height = H*z + 'px';
}

$('file').onchange = e => loadFile(e.target.files[0]);
const da = $('dropArea');
da.ondragover = e => { e.preventDefault(); da.classList.add('drop'); };
da.ondragleave = () => da.classList.remove('drop');
da.ondrop = e => { e.preventDefault(); da.classList.remove('drop'); loadFile(e.dataTransfer.files[0]); };

// 長辺サイズの自前プルダウン（ドットフォントを効かせるため）
const maxBtn = $('maxBtn'), maxList = $('maxList');
let maxSize = 64;
const setMax = v => { maxSize = v; maxBtn.textContent = v; maxList.hidden = true;
  [...maxList.children].forEach(b => b.setAttribute('aria-selected', +b.textContent === v)); render(); };
for (let v = 16; v <= 256; v += 16){
  const b = maxList.appendChild(document.createElement('button'));
  b.type = 'button'; b.role = 'option'; b.textContent = v; b.onclick = () => { setMax(v); maxBtn.focus(); };
}
maxBtn.onclick = () => { maxList.hidden = !maxList.hidden;
  if (!maxList.hidden) (maxList.querySelector('[aria-selected=true]') || maxList.firstChild).focus(); };
maxList.onkeydown = e => {
  const f = document.activeElement;
  if (e.key === 'ArrowDown' && f.nextSibling) { f.nextSibling.focus(); e.preventDefault(); }
  if (e.key === 'ArrowUp' && f.previousSibling) { f.previousSibling.focus(); e.preventDefault(); }
  if (e.key === 'Escape') { maxList.hidden = true; maxBtn.focus(); }
};
document.addEventListener('pointerdown', e => { if (!e.target.closest('.dd')) maxList.hidden = true; });
setMax(64);
// ■■■■□□□ 形式の段階バー
function makeBar(el, values, start, onchange){
  const cells = values.map(() => el.appendChild(document.createElement('i')));
  let idx = start;
  const set = i => {
    i = Math.max(0, Math.min(values.length - 1, i));
    const changed = i !== idx; idx = i; el.value = values[i];
    cells.forEach((c, k) => c.classList.toggle('on', k <= i));
    el.setAttribute('aria-valuenow', i + 1); el.setAttribute('aria-valuemax', values.length);
    if (changed) onchange();
  };
  const fromX = e => {
    const r = el.getBoundingClientRect();
    set(Math.floor((e.clientX - r.left) / r.width * values.length));
  };
  el.onpointerdown = e => { el.setPointerCapture(e.pointerId); fromX(e); };
  el.onpointermove = e => { if (el.hasPointerCapture(e.pointerId)) fromX(e); };
  el.onkeydown = e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { set(idx + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { set(idx - 1); e.preventDefault(); }
  };
  const cb = onchange; onchange = () => {};
  idx = -1; set(start); onchange = cb;
}
makeBar($('th'),  [30, 50, 70, 90, 110, 130, 150, 170, 190, 210], 3, () => { buildIntegral(); render(); });
makeBar($('cov'), [60, 50, 40, 30, 25, 20, 15, 10, 6, 3], 6, render);
window.onresize = render;

$('save').onclick = () => {
  const a = document.createElement('a');
  a.download = `line_${out.width}x${out.height}.png`;
  a.href = out.toDataURL('image/png'); a.click();
};
</script>
</body>
</html>
