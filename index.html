  :root { --bg:#e6e8eb; --panel:#ffffff; --ink:#1d2127; --sub:#6b7380; --line:#c9ced6; --accent:#2f6fde; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"KHDot", system-ui, sans-serif; background:var(--bg); color:var(--ink); font-size:12px; line-height:1; -webkit-font-smoothing:none; font-smooth:never; }
  header { padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:24px; font-weight:normal; }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; padding:12px; }
  a { display:block; padding:14px; background:var(--panel); border:1px solid var(--line); border-radius:4px; color:var(--ink); text-decoration:none; }
  a:hover { border-color:var(--ink); }
  a img { display:block; width:180px; height:120px; margin-bottom:12px; image-rendering:pixelated; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<header><h1>Tools</h1></header>
<main id="list"></main>
<script>
// ツールを増やしたら、ここに1行足すだけ
const TOOLS = [
  { name: 'Line Dot', path: 'line-dot/' },
];
const list = document.getElementById('list');
for (const t of TOOLS){
  const a = list.appendChild(document.createElement('a'));
  a.href = t.path;
  const img = a.appendChild(document.createElement('img'));
  img.src = t.path + 'thumb.png'; img.alt = '';
  a.append(t.name);
}
</script>
</body>
