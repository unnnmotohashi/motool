  :root { --bg:#e6e8eb; --panel:#ffffff; --ink:#1d2127; --sub:#6b7380; --line:#c9ced6; --accent:#2f6fde; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; font-family:"KHDot", system-ui, sans-serif; background:var(--bg); color:var(--ink); font-size:12px; line-height:1; -webkit-font-smoothing:none; font-smooth:never; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  .top { color:var(--sub); text-decoration:none; margin-right:6px; }
  .top:hover { color:var(--ink); }
  .grow { flex:1; }
  .sp { width:10px; }
  .cnt { color:var(--sub); }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:4px; background:#f5f6f8; font:inherit; color:var(--ink); cursor:pointer; }
  button:disabled { color:var(--sub); cursor:default; }
  button[aria-pressed=true] { background:var(--ink); border-color:var(--ink); color:#fff; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:disabled { opacity:.5; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  main { display:flex; flex-direction:column; gap:12px; padding:12px; max-width:960px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:4px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px; border-bottom:1px solid var(--line); }
  .bar:last-child { border-bottom:0; }
  label, .lab { display:flex; align-items:center; gap:6px; color:var(--sub); }
  .lv { display:flex; gap:2px; padding:2px; cursor:pointer; touch-action:none; }
  .lv i { width:8px; height:18px; border:1.5px solid var(--ink); background:#fff; }
  .lv i.on { background:var(--ink); }
  #val { color:var(--ink); }
  .dd { position:relative; }
  .dd > button { width:68px; text-align:left; padding:6px 8px; }
  .dd > button::after { content:"▼"; float:right; }
  .list { position:absolute; top:100%; left:0; z-index:10; width:68px; background:#fff; border:1px solid var(--ink); }
  .list button { display:block; width:100%; text-align:left; border:0; border-radius:0; background:#fff; padding:5px 8px; }
  .list button:hover, .list button:focus-visible { background:var(--ink); color:#fff; outline:0; }
  .list button[aria-selected=true] { text-decoration:underline; }
  .wrap { max-height:60vh; overflow:auto; }
  body.drag .wrap { outline:2px dashed var(--accent); outline-offset:-2px; }
  table { width:100%; border-collapse:collapse; }
  th { position:sticky; top:0; z-index:1; background:var(--panel); color:var(--sub); font-weight:normal; text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:5px 10px; border-top:1px solid var(--line); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  tbody tr:first-child td { border-top:0; }
  th.n, td.n { width:100%; max-width:0; text-align:left; overflow:hidden; text-overflow:ellipsis; }
  td.p { padding:3px 4px 3px 10px; }
  tbody tr { cursor:pointer; user-select:none; }
  tbody tr:hover { background:#f5f6f8; }
  tbody tr[aria-selected=true] { background:#e7eefb; box-shadow:inset 2px 0 var(--accent); }
  tbody tr:focus-visible { outline-offset:-2px; }
  tr.wait td { color:var(--sub); }
  tr.empty td { padding:48px 10px; text-align:center; color:var(--sub); cursor:default; }
  tr.empty:hover { background:none; }
  .play { display:flex; align-items:center; justify-content:center; width:26px; height:22px; padding:0; }
  .play::before { content:""; border-left:7px solid currentColor; border-top:4px solid transparent; border-bottom:4px solid transparent; margin-left:2px; }
  .play[aria-pressed=true]::before { width:8px; height:8px; border:0; margin:0; background:currentColor; }
  .hint { padding:8px 10px; color:var(--sub); line-height:1.6; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <a class="top" href="../">Top</a>
  <button id="open" title="WAV・MP3・OGG を追加">開く</button>
  <button id="openDir" title="フォルダの中の音声ファイルをまとめて追加">フォルダ</button>
  <span class="grow"></span>
  <button id="del" title="選んでいるファイルを一覧から外す（Deleteキーでも外せます）" disabled>削除</button>
  <button id="clear" disabled>全部消す</button>
  <span class="cnt" id="count"></span>
  <button class="primary" id="save" title="1件ならそのファイル、2件以上ならZIPで保存します。名前は元のファイルと同じです" disabled>保存</button>
  <input type="file" id="files" accept=".wav,.mp3,.ogg,audio/wav,audio/mpeg,audio/ogg" multiple hidden>
  <input type="file" id="dir" webkitdirectory multiple hidden>
</header>
<main>
  <section class="box" aria-label="設定">
    <div class="bar">
      <button id="pBGM" aria-pressed="false" title="平均の音量を -18dBFS に">BGM</button>
      <button id="pSE" aria-pressed="false" title="いちばん大きいところを -2dBFS に">効果音</button>
      <button id="pVOICE" aria-pressed="false" title="平均の音量を -16dBFS に">ボイス</button>
      <span class="sp"></span>
      <span class="lab">基準</span>
      <button id="mAvg" aria-pressed="false" title="平均の音量（RMS）を目標に合わせる">平均</button>
      <button id="mPeak" aria-pressed="false" title="いちばん大きいところを目標に合わせる">最大</button>
      <button id="mFlat" aria-pressed="false" title="全部のファイルを同じだけ上げ下げする">一律</button>
    </div>
    <div class="bar">
      <span class="lab" id="lvName">目標</span>
      <span class="lv" id="lv" role="slider" tabindex="0" aria-label="目標"></span>
      <span id="val"></span>
    </div>
    <div class="bar">
      <span class="lab">形式</span>
      <button id="fOrig" aria-pressed="false">元のまま</button>
      <button id="fWav" aria-pressed="false">WAV</button>
      <button id="fMp3" aria-pressed="false">MP3</button>
      <button id="fOgg" aria-pressed="false">OGG</button>
      <span class="sp"></span>
      <label id="mp3Box">MP3 <span class="dd"><button id="mp3" aria-haspopup="listbox" aria-label="MP3のビットレート"></button></span></label>
      <label id="oggBox" title="0〜10。大きいほど高音質でファイルも大きくなります">OGG品質 <span class="dd"><button id="ogg" aria-haspopup="listbox" aria-label="OGGの品質"></button></span></label>
    </div>
  </section>
  <section class="box" aria-label="ファイル">
    <div class="wrap">
      <table>
        <thead><tr>
          <th></th><th class="n">ファイル名</th><th>長さ</th>
          <th title="平均の音量（RMS, dBFS）">平均</th>
          <th title="いちばん大きいところ（dBFS）">最大</th>
          <th title="保存するときに上げ下げする量（dB）">増減</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="hint" id="hint"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EXT = /\.(wav|mp3|ogg)$/i;
const CEIL = -0.3;      // 音割れしないよう、上げるのはピークがここに届くまで
const N = 20;           // 段階バーのマス（1マス1dB）
const RANGE = { avg: -25, peak: -20, flat: -14 };   // 各基準のいちばん左のマスの値
const PRESETS = { pBGM: ['avg', -18], pSE: ['peak', -2], pVOICE: ['avg', -16] };
const MODES = { mAvg: 'avg', mPeak: 'peak', mFlat: 'flat' };
const FMTS = { fOrig: 'orig', fWav: 'wav', fMp3: 'mp3', fOgg: 'ogg' };
const MP3_RATES = [8000, 11025, 12000, 16000, 22050, 24000, 32000, 44100, 48000];
const HINT = 'クリックで選ぶ（Ctrl・Shiftで複数）。選んでいなければ全部を保存します';

const set = { mode: 'avg', avg: -18, peak: -2, flat: 0, fmt: 'orig', mp3: 192, ogg: 4 };
let files = [], sel = new Set(), anchor = null, cursor = null, nextId = 1, busy = false, actx = null, playing = null, msg = '';

const db = x => x > 0 ? 20 * Math.log10(x) : -Infinity;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const num = v => isFinite(v) ? v.toFixed(1) : '-inf';
const sign = v => (v > 0 ? '+' : '') + v.toFixed(1);
const time = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

// ---- 読み込み ----
// ブラウザは読み込むときに再生用のレートへ変換してしまうので、ヘッダーから元のレートを読んでそのレートで読み込む
function sniff(ab) {
  const u = new Uint8Array(ab), dv = new DataView(ab), id = o => String.fromCharCode(u[o], u[o + 1], u[o + 2], u[o + 3]);
  if (u.length > 12 && id(0) === 'RIFF' && id(8) === 'WAVE') {
    for (let o = 12; o + 8 <= u.length;) {
      const n = dv.getUint32(o + 4, true);
      if (id(o) === 'fmt ' && o + 24 <= u.length) {
        let f = dv.getUint16(o + 8, true);
        if (f === 0xFFFE && n >= 26) f = dv.getUint16(o + 32, true);
        return { type: 'wav', rate: dv.getUint32(o + 12, true), bits: dv.getUint16(o + 22, true), float: f === 3 };
      }
      o += 8 + n + (n & 1);
    }
    return { type: 'wav' };
  }
  if (id(0) === 'OggS') {
    const s = Array.from(u.subarray(0, 4096), c => String.fromCharCode(c)).join('');
    const i = s.indexOf('\x01vorbis');
    if (i >= 0 && i + 16 <= u.length) return { type: 'ogg', rate: dv.getUint32(i + 12, true) };
    return { type: 'ogg', rate: s.includes('OpusHead') ? 48000 : 0 };
  }
  let o = 0;
  if (id(0).startsWith('ID3')) o = 10 + ((u[6] & 127) << 21 | (u[7] & 127) << 14 | (u[8] & 127) << 7 | (u[9] & 127)) + (u[5] & 16 ? 10 : 0);
  for (const end = Math.min(u.length - 4, o + 65536); o < end; o++) {
    if (u[o] !== 255 || (u[o + 1] & 0xE0) !== 0xE0) continue;
    const v = (u[o + 1] >> 3) & 3, l = (u[o + 1] >> 1) & 3, r = (u[o + 2] >> 2) & 3, b = u[o + 2] >> 4;
    if (v === 1 || l === 0 || r === 3 || b === 0 || b === 15) continue;
    return { type: 'mp3', rate: [[11025, 12000, 8000], null, [22050, 24000, 16000], [44100, 48000, 32000]][v][r] };
  }
  return { type: null };
}

async function decode(file) {
  const ab = await file.arrayBuffer(), info = sniff(ab);
  const buf = await new OfflineAudioContext(1, 1, clamp(info.rate || 44100, 3000, 384000)).decodeAudioData(ab);
  if (!info.type) info.type = (file.name.match(EXT) || [, 'wav'])[1].toLowerCase();
  return { buf, info };
}

// 平均（RMS）とピーク。全チャンネルまとめて測る
function measure(buf) {
  let sum = 0, peak = 0, n = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) { const v = d[i]; sum += v * v; if (v > peak) peak = v; else if (-v > peak) peak = -v; }
    n += d.length;
  }
  return { avg: n ? db(Math.sqrt(sum / n)) : -Infinity, peak: db(peak) };
}

let loading = 0;
async function add(items) {
  const have = new Set(files.map(f => f.key)), fresh = [];
  for (const it of items) {
    if (!EXT.test(it.file.name)) continue;
    const key = it.path + '|' + it.file.size + '|' + it.file.lastModified;
    if (have.has(key)) continue;
    have.add(key);
    fresh.push({ id: nextId++, key, path: it.path, name: it.file.name, file: it.file, buf: null });
  }
  if (!fresh.length) return;
  files.push(...fresh);
  files.sort((a, b) => a.path.localeCompare(b.path, 'ja', { numeric: true }));
  render();
  loading++;
  const bad = [];
  for (const [i, f] of fresh.entries()) {
    status(`読み込み中 ${i + 1}/${fresh.length}`);
    try { Object.assign(f, await decode(f.file)); Object.assign(f, measure(f.buf)); }
    catch { bad.push(f.name); files = files.filter(x => x !== f); sel.delete(f.id); }
    f.file = null;
    render();
  }
  loading--;
  status(bad.length ? '読めなかったファイル：' + bad.join(', ') : '');
}

// ---- 増減の計算 ----
function gainOf(f) {
  if (!f.buf) return null;
  let g;
  if (set.mode === 'flat') g = set.flat;
  else { const base = set.mode === 'avg' ? f.avg : f.peak; g = isFinite(base) ? set[set.mode] - base : 0; }
  const lim = isFinite(f.peak) ? CEIL - f.peak : Infinity;
  return g > lim ? { g: lim, cap: true } : { g, cap: false };
}

// ---- 一覧 ----
function render() {
  const tb = $('rows'), had = tb.contains(document.activeElement);
  if (!files.length) tb.innerHTML = '<tr class="empty"><td colspan="6">WAV・MP3・OGG をドロップ（フォルダごとでも可）</td></tr>';
  else {
    if (!files.some(f => f.id === cursor)) cursor = files[0].id;
    tb.innerHTML = files.map(f => {
      const g = gainOf(f), on = sel.has(f.id), pl = playing && playing.id === f.id;
      const cells = f.buf
        ? `<td>${time(f.buf.duration)}</td><td>${num(f.avg)}</td><td>${num(f.peak)}</td>`
          + (g.cap ? `<td title="音割れしないよう、ここで止めています">${sign(g.g)}!</td>` : `<td>${sign(g.g)}</td>`)
        : '<td>…</td><td></td><td></td><td></td>';
      return `<tr data-id="${f.id}" tabindex="${f.id === cursor ? 0 : -1}" aria-selected="${on}"${f.buf ? '' : ' class="wait"'}>`
        + `<td class="p"><button class="play" tabindex="-1" aria-label="再生" aria-pressed="${!!pl}"${f.buf ? '' : ' disabled'}></button></td>`
        + `<td class="n" title="${esc(f.path)}">${esc(f.name)}</td>${cells}</tr>`;
    }).join('');
    if (had) focusRow(cursor);
  }
  const n = files.filter(f => f.buf).length, ns = files.filter(f => f.buf && sel.has(f.id)).length;
  $('count').textContent = !n ? '' : ns ? `選んだ${ns}件` : `全${n}件`;
  $('save').disabled = busy || !(ns || n);
  $('del').disabled = busy || !sel.size;
  $('clear').disabled = busy || !files.length;
  showSettings();
  $('hint').textContent = msg || (files.length ? HINT : '');
}
const status = t => { msg = t; $('hint').textContent = msg || (files.length ? HINT : ''); };
const rowOf = id => $('rows').querySelector(`tr[data-id="${id}"]`);
function focusRow(id) { const r = rowOf(id); if (r) { r.focus({ preventScroll: true }); r.scrollIntoView({ block: 'nearest' }); } }

function pick(id, e) {
  const ids = files.map(f => f.id);
  if (e && e.shiftKey && ids.includes(anchor)) {
    const a = ids.indexOf(anchor), b = ids.indexOf(id);
    if (!(e.ctrlKey || e.metaKey)) sel.clear();
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) sel.add(ids[i]);
  } else if (e && (e.ctrlKey || e.metaKey)) {
    sel.has(id) ? sel.delete(id) : sel.add(id);
    anchor = id;
  } else {
    // 1件だけ選んでいる行をもう一度押すと選択を外す（全部が対象に戻る）
    const only = sel.size === 1 && sel.has(id);
    sel.clear();
    if (!only) sel.add(id);
    anchor = id;
  }
  cursor = id;
  render();
}

function removeSel() {
  if (busy || !sel.size) return;
  if (playing && sel.has(playing.id)) stop();
  const i = files.findIndex(f => sel.has(f.id));
  files = files.filter(f => !sel.has(f.id));
  sel.clear();
  cursor = files.length ? files[Math.min(i, files.length - 1)].id : null;
  render();
  if (cursor != null) focusRow(cursor);
}

$('rows').onclick = e => {
  const tr = e.target.closest('tr[data-id]'); if (!tr) return;
  const id = +tr.dataset.id;
  if (e.target.closest('.play')) { toggle(files.find(f => f.id === id)); cursor = id; return; }
  pick(id, e);
};
$('rows').onkeydown = e => {
  const ids = files.map(f => f.id), i = ids.indexOf(cursor);
  if (i < 0) return;
  const d = { ArrowDown: 1, ArrowUp: -1 }[e.key];
  if (d) {
    const id = ids[clamp(i + d, 0, ids.length - 1)];
    if (e.shiftKey) pick(id, e); else { cursor = id; sel.clear(); sel.add(id); anchor = id; render(); }
    focusRow(id);
  }
  else if (e.key === ' ' || e.key === 'Enter') toggle(files[i]);
  else if (e.key === 'Delete' || e.key === 'Backspace') removeSel();
  else if (e.key === 'Escape') { sel.clear(); render(); }
  else if (e.key === 'a' && (e.ctrlKey || e.metaKey)) { ids.forEach(x => sel.add(x)); render(); }
  else return;
  e.preventDefault();
};

// ---- 試聴（増減をかけた音で鳴らす）----
function toggle(f) {
  if (!f || !f.buf) return;
  if (playing && playing.id === f.id) { stop(); return render(); }
  stop();
  actx = actx || new AudioContext();
  actx.resume();
  const src = actx.createBufferSource(), gn = actx.createGain();
  src.buffer = f.buf;
  gn.gain.value = 10 ** (gainOf(f).g / 20);
  src.connect(gn).connect(actx.destination);
  src.onended = () => { if (playing && playing.src === src) { playing = null; render(); } };
  src.start();
  playing = { id: f.id, f, src, gn };
  render();
}
function stop() { if (!playing) return; const p = playing; playing = null; try { p.src.stop(); } catch {} }

// ---- 設定 ----
const cells = [...Array(N)].map(() => $('lv').appendChild(document.createElement('i')));

function showSettings() {
  for (const id in PRESETS) { const [m, v] = PRESETS[id]; $(id).setAttribute('aria-pressed', set.mode === m && set[m] === v); }
  for (const id in MODES) $(id).setAttribute('aria-pressed', set.mode === MODES[id]);
  for (const id in FMTS) $(id).setAttribute('aria-pressed', set.fmt === FMTS[id]);
  const flat = set.mode === 'flat', v = set[set.mode], lo = RANGE[set.mode], k = v - lo;
  // 一律は 0dB のマスを中心に、上げる側・下げる側へ黒く伸ばす
  cells.forEach((c, j) => c.classList.toggle('on', flat ? (j - lo === 0 || (j >= Math.min(k, -lo) && j <= Math.max(k, -lo))) : j <= k));
  const text = flat ? `${v > 0 ? '+' : ''}${v}dB（${Math.round(100 * 10 ** (v / 20))}%）` : `${v}dBFS`;
  $('val').textContent = text;
  $('lvName').textContent = flat ? '増減' : '目標';
  const lv = $('lv');
  lv.setAttribute('aria-label', flat ? '増減' : '目標');
  lv.setAttribute('aria-valuemin', lo); lv.setAttribute('aria-valuemax', lo + N - 1);
  lv.setAttribute('aria-valuenow', v); lv.setAttribute('aria-valuetext', text);
  const types = new Set(files.map(f => f.info && f.info.type));
  $('mp3Box').hidden = !(set.fmt === 'mp3' || (set.fmt === 'orig' && types.has('mp3')));
  $('oggBox').hidden = !(set.fmt === 'ogg' || (set.fmt === 'orig' && types.has('ogg')));
  $('mp3').textContent = set.mp3 + 'k';
  $('ogg').textContent = set.ogg;
}
function changed() {
  if (playing) playing.gn.gain.value = 10 ** (gainOf(playing.f).g / 20);
  render();
}
for (const id in PRESETS) $(id).onclick = () => { const [m, v] = PRESETS[id]; set.mode = m; set[m] = v; changed(); };
for (const id in MODES) $(id).onclick = () => { set.mode = MODES[id]; changed(); };
for (const id in FMTS) $(id).onclick = () => { set.fmt = FMTS[id]; render(); };

{
  const lv = $('lv');
  const put = j => { const v = RANGE[set.mode] + clamp(j, 0, N - 1); if (v !== set[set.mode]) { set[set.mode] = v; changed(); } };
  const fromX = e => { const r = lv.getBoundingClientRect(); put(Math.floor((e.clientX - r.left) / r.width * N)); };
  lv.onpointerdown = e => { lv.setPointerCapture(e.pointerId); fromX(e); };
  lv.onpointermove = e => { if (lv.hasPointerCapture(e.pointerId)) fromX(e); };
  lv.onkeydown = e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (d) { put(set[set.mode] - RANGE[set.mode] + d); e.preventDefault(); }
  };
}

// ---- 選択欄（自作の一覧。<select> は開いた一覧にフォントが効かないため）----
let openDD = null;
function dropdown(key, values, label) {
  const btn = $(key), list = document.createElement('span');
  list.className = 'list'; list.hidden = true;
  list.setAttribute('role', 'listbox'); list.setAttribute('aria-label', btn.getAttribute('aria-label'));
  values.forEach(v => {
    const o = list.appendChild(document.createElement('button'));
    o.type = 'button'; o.setAttribute('role', 'option'); o.textContent = label(v);
    o.onclick = () => { close(); set[key] = v; render(); btn.focus(); };
  });
  btn.after(list);
  const close = () => { list.hidden = true; if (openDD === close) openDD = null; };
  btn.onclick = e => {
    e.preventDefault();
    if (!list.hidden) return close();
    if (openDD) openDD();
    list.hidden = false; openDD = close;
    const i = values.indexOf(set[key]);
    [...list.children].forEach((o, j) => o.setAttribute('aria-selected', j === i));
    list.children[Math.max(0, i)].focus();
  };
  btn.onkeydown = e => {
    const d = { ArrowUp: -1, ArrowDown: 1 }[e.key];
    if (d && list.hidden) { set[key] = values[clamp(values.indexOf(set[key]) + d, 0, values.length - 1)]; render(); e.preventDefault(); }
  };
  list.onkeydown = e => {
    const f = document.activeElement;
    if (e.key === 'ArrowDown' && f.nextSibling) { f.nextSibling.focus(); e.preventDefault(); }
    if (e.key === 'ArrowUp' && f.previousSibling) { f.previousSibling.focus(); e.preventDefault(); }
    if (e.key === 'Escape') { close(); btn.focus(); }
  };
}
document.addEventListener('pointerdown', e => { if (openDD && !e.target.closest('.dd')) openDD(); });
dropdown('mp3', [128, 192, 256, 320], v => v + 'k');
dropdown('ogg', [0, 2, 4, 6, 8, 10], String);

// ---- 書き出し ----
function wav(ch, rate, info) {
  const fl = info.float && info.bits === 32, bits = fl ? 32 : info.bits >= 24 ? 24 : 16, bps = bits / 8;
  const nc = ch.length, n = ch[0].length, size = n * nc * bps;
  const u = new Uint8Array(44 + size + (size & 1)), dv = new DataView(u.buffer);
  const str = (o, s) => { for (let i = 0; i < 4; i++) u[o + i] = s.charCodeAt(i); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + size + (size & 1), true); str(8, 'WAVE');
  str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, fl ? 3 : 1, true); dv.setUint16(22, nc, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * nc * bps, true); dv.setUint16(32, nc * bps, true); dv.setUint16(34, bits, true);
  str(36, 'data'); dv.setUint32(40, size, true);
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < nc; c++) {
    const v = ch[c][i];
    if (fl) { dv.setFloat32(o, v, true); o += 4; }
    else if (bits === 16) { dv.setInt16(o, Math.round(v < 0 ? v * 32768 : v * 32767), true); o += 2; }
    else { const s = Math.round(v < 0 ? v * 8388608 : v * 8388607); u[o] = s & 255; u[o + 1] = s >> 8 & 255; u[o + 2] = s >> 16 & 255; o += 3; }
  }
  return u;
}

// MP3・OGG のエンコーダーは使うときに1回だけ展開する
const wasmCache = {};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const gunzip = async u => new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
const wasmOf = fmt => wasmCache[fmt] ||= gunzip(b64(WASM[fmt])).then(b => WebAssembly.compile(b));

async function lossy(fmt, ch, rate) {
  const enc = await WasmMediaEncoder.createEncoder(fmt === 'mp3' ? 'audio/mpeg' : 'audio/ogg', await wasmOf(fmt));
  const p = { channels: ch.length, sampleRate: rate };
  if (fmt === 'mp3') {
    p.bitrate = set.mp3;
    if (!MP3_RATES.includes(rate)) p.outputSampleRate = MP3_RATES.find(r => r >= rate) || 48000;
  } else p.vbrQuality = set.ogg;
  enc.configure(p);
  const parts = [], step = 1152 * 128;
  for (let i = 0; i < ch[0].length; i += step) {
    parts.push(enc.encode(ch.map(d => d.subarray(i, i + step))).slice());
    await new Promise(r => setTimeout(r));
  }
  parts.push(enc.finalize().slice());
  return new Blob(parts);
}

async function encodeFile(f) {
  const fmt = set.fmt === 'orig' ? f.info.type : set.fmt, k = 10 ** (gainOf(f).g / 20), b = f.buf;
  const ch = [];
  for (let c = 0; c < b.numberOfChannels; c++) {
    const d = b.getChannelData(c), o = new Float32Array(d.length);
    for (let i = 0; i < d.length; i++) o[i] = clamp(d[i] * k, -1, 1);
    ch.push(o);
  }
  const data = fmt === 'wav' ? new Blob([wav(ch, b.sampleRate, f.info.type === 'wav' ? f.info : {})])
    : await lossy(fmt, ch.slice(0, 2), b.sampleRate);
  return { path: f.path.replace(/\.[^./]+$/, '.' + fmt), data };
}

// ZIP（無圧縮。音声はもともと詰まっているので圧縮してもほとんど縮まない）
const CRC = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c; });
const crc32 = u => { let c = -1; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; };
async function zip(entries) {
  const te = new TextEncoder(), parts = [], cd = [], now = new Date();
  const tm = now.getHours() << 11 | now.getMinutes() << 5 | now.getSeconds() >> 1;
  const dt = (now.getFullYear() - 1980) << 9 | (now.getMonth() + 1) << 5 | now.getDate();
  let off = 0;
  for (const e of entries) {
    const name = te.encode(e.path), data = new Uint8Array(await e.data.arrayBuffer()), crc = crc32(data), n = data.length;
    const h = new DataView(new ArrayBuffer(30)), c = new DataView(new ArrayBuffer(46));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true);
    h.setUint16(10, tm, true); h.setUint16(12, dt, true); h.setUint32(14, crc, true);
    h.setUint32(18, n, true); h.setUint32(22, n, true); h.setUint16(26, name.length, true);
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x800, true);
    c.setUint16(12, tm, true); c.setUint16(14, dt, true); c.setUint32(16, crc, true);
    c.setUint32(20, n, true); c.setUint32(24, n, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    parts.push(h.buffer, name, data);
    cd.push(c.buffer, name);
    off += 30 + name.length + n;
  }
  const size = cd.reduce((s, a) => s + a.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, off, true);

}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function save() {
  if (busy) return;
  const list = files.filter(f => f.buf && (!sel.size || sel.has(f.id)));
  if (!list.length) return;
  busy = true; render();
  const out = [], bad = [], used = new Set();
  for (const [i, f] of list.entries()) {
    status(`保存中 ${i + 1}/${list.length}`);
    try {
      const r = await encodeFile(f);
      // 同じ名前になるときは _2, _3 … を付ける
      let p = r.path;
      for (let k = 2; used.has(p.toLowerCase()); k++) p = r.path.replace(/(\.[^.]+)$/, `_${k}$1`);
      used.add(p.toLowerCase()); r.path = p;
      out.push(r);
    } catch (e) { console.error(e); bad.push(f.name); }
  }
  if (out.length === 1) download(out[0].data, out[0].path.split('/').pop());
  else if (out.length) {
    const tops = new Set(out.map(r => r.path.includes('/') ? r.path.split('/')[0] : ''));
    const top = tops.size === 1 ? [...tops][0] : '';
    download(await zip(out), (top || 'audio') + '.zip');
  }
  busy = false;
  render();
  status(bad.length ? '保存できなかったファイル：' + bad.join(', ') : `${out.length}件を保存しました`);
}

// ---- ファイル操作 ----
$('open').onclick = () => $('files').click();
$('openDir').onclick = () => $('dir').click();
$('files').onchange = e => { add([...e.target.files].map(f => ({ file: f, path: f.name }))); e.target.value = ''; };
$('dir').onchange = e => { add([...e.target.files].map(f => ({ file: f, path: f.webkitRelativePath || f.name }))); e.target.value = ''; };
$('del').onclick = removeSel;
$('clear').onclick = () => { if (busy) return; stop(); files = []; sel.clear(); msg = ''; render(); };
$('save').onclick = save;

// フォルダごとのドロップにも対応（中のフォルダも含めて探す）
async function dropped(dt) {
  const entries = [...dt.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return [...dt.files].map(f => ({ file: f, path: f.name }));
  const out = [];
  const walk = async e => {
    if (e.isFile) out.push({ file: await new Promise((ok, ng) => e.file(ok, ng)), path: e.fullPath.replace(/^\//, '') });
    else if (e.isDirectory) {
      const rd = e.createReader();
      for (let es; (es = await new Promise((ok, ng) => rd.readEntries(ok, ng))).length;) for (const x of es) await walk(x);
    }
  };
  for (const e of entries) { try { await walk(e); } catch {} }
  return out;
}
let dragN = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); if (dragN++ === 0) document.body.classList.add('drag'); });
document.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; document.body.classList.remove('drag'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault(); dragN = 0; document.body.classList.remove('drag');
  add(await dropped(e.dataTransfer));
});

render();
